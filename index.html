<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Өтінімдер тізімі / Реестр заявок</title>
  <meta name="theme-color" content="#0f766e" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --done: #15803d;
      --done-bg: #dcfce7;
      --open-bg: #fef3c7;
      --open-text: #92400e;
      --border: #e2e8f0;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .container {
      max-width: 680px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 { margin: 0; font-size: 1.25rem; }
    .subtitle { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); }
    .lang-switch { display: flex; gap: 6px; }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    button.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    button.primary:hover { background: var(--accent-hover); }
    button.small { padding: 5px 10px; font-size: 0.8rem; }

    button.danger {
      color: var(--danger);
      border-color: #fecaca;
      background: #fef2f2;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 180px auto;
      gap: 10px;
    }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }

    input, select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      background: #fff;
      color: var(--text);
    }

    .error-msg {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--danger);
      min-height: 1.2em;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .list { display: flex; flex-direction: column; gap: 10px; }

    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .item-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 200px;
      flex: 1;
    }

    .item-title { font-weight: 600; word-break: break-word; }
    .item.done .item-title { text-decoration: line-through; color: var(--muted); }
    .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.8rem; }
    .badge { padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .badge.open { background: var(--open-bg); color: var(--open-text); }
